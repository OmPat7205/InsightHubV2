name: Daily Intelligence Brief

on:
  schedule:
    # Runs at 12:00 UTC = 7:00 AM EST
    - cron: '0 12 * * *'
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering from GitHub UI

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        pip install -r insight-hub/requirements.txt

    - name: Run Intelligence Pipeline
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: |
        python run.py

    - name: Generate Dashboard Site
      run: |
        python generate_site.py

    - name: Commit and Push Output
      run: |
        git config --global user.name 'Insight Hub Bot'
        git config --global user.email 'bot@insighthub.ai'
        git add output/
        # Only commit if there are changes
        git diff --quiet && git diff --staged --quiet || (git commit -m "Daily Intelligence Update [$(date)]" && git push origin HEAD:main)
